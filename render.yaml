services:
  - type: web
    name: f1-race-radar
    runtime: python
    branch: main
    plan: free
    region: singapore
    buildCommand: python -m pip install -r requirements-live.txt && python build.py
    startCommand: python server.py --host 0.0.0.0
    healthCheckPath: /api/live/status
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.12
      - key: OPENF1_USERNAME
        sync: false
      - key: OPENF1_PASSWORD
        sync: false
